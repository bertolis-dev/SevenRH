<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus</title>
  <meta name="description" content="Nexus est le SIRH simple pour piloter congés, planning, paie et notes de frais — un seul outil clair pour toute votre équipe, installable comme une vraie application.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nexus-rh.com/">
  <meta property="og:title" content="Nexus — Le SIRH simple pour votre entreprise">
  <meta property="og:description" content="Congés, planning, paie, notes de frais et tickets restaurant réunis dans un seul outil clair. Installable sur PC, iPhone et Android.">
  <meta property="og:image" content="https://nexus-rh.com/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Nexus — Le SIRH simple pour votre entreprise">
  <meta name="twitter:description" content="Congés, planning, paie, notes de frais et tickets restaurant réunis dans un seul outil clair.">
  <meta name="twitter:image" content="https://nexus-rh.com/icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c2b4a">
  <link rel="stylesheet" href="style.css?v=20260820r">
</head>
<body>
  <div id="landing-root" style="display: none;"></div>

  <div id="login-root" style="display: none;"></div>

  <div id="bertolis-root" style="display: none;"></div>

  <!-- Page publique atteinte via le QR code "Embauche" (?candidature=<companyId>) — aucun compte,
       aucune connexion, jamais de chrome applicatif (voir renderCandidatureForm, app.js). -->
  <div id="candidature-root" style="display: none;"></div>

  <div id="app-shell" style="display: none;">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark"><img class="logo-icon" src="logo.png" alt="Nexus"></span>
        <span class="logo-text">Nexus</span>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>

    <div id="main-column">
      <div id="non-souscrit-banner" class="non-souscrit-banner" style="display: none;"></div>
      <div id="sync-failure-banner" class="sync-failure-banner" style="display: none;"></div>
      <header id="topbar">
        <!-- Mobile uniquement (voir style.css @media 860px) : bouton "☰" à gauche de la barre de
             recherche, qui déroule #sidebar-nav juste en-dessous — plutôt qu'une rangée de boutons
             à faire défiler horizontalement. Voir bindGlobalEvents (app.js) pour le comportement. -->
        <button type="button" id="btn-mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div class="topbar-search">
          <input type="text" id="global-search-input" class="input" placeholder="Rechercher un salarié, une demande, une note de frais... (Ctrl+K)" autocomplete="off">
          <div id="global-search-results" class="search-results"></div>
        </div>
        <div class="topbar-user">
          <button class="btn-icon" id="btn-help" title="Aide sur cet écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><line x1="12" y1="16.5" x2="12" y2="16.6"/></svg></button>
          <div class="notif-wrapper">
            <button class="btn-icon notif-bell" id="btn-notifications" title="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 3.5 1 5.5 2 6.5H4c1-1 2-3 2-6.5z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0"/></svg>
              <span class="notif-badge" id="notif-badge" style="display: none;"></span>
            </button>
            <div id="notif-panel" class="notif-panel"></div>
          </div>
          <div class="user-menu-wrapper">
            <button class="avatar avatar-initials" id="btn-user-menu" title="Mon compte">RH</button>
            <div id="user-menu-panel" class="user-menu-panel"></div>
          </div>
        </div>
      </header>

      <main id="view-root"></main>
    </div>
  </div>

  <div id="modal-root" role="dialog" aria-modal="true"></div>
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="supabase-client.js?v=20260820r"></script>
  <script src="qrcode.js?v=20260820r"></script>
  <script src="data.js?v=20260820r"></script>
  <script src="app.js?v=20260820r"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=20260820r'));
    }
  </script>
</body>
</html>
